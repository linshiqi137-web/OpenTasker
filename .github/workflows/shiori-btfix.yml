name: Shiori Bluetooth Fix APK

on:
  push:
    branches:
      - shiori-bluetooth-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK 37
        run: |
          echo "SDK location: $ANDROID_HOME"
          command -v sdkmanager
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-37" "build-tools;35.0.0"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload BT Fix APK
        uses: actions/upload-artifact@v4
        with:
          name: Shiori-OpenTasker-BT-Fix
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
